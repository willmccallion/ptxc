# cargo-mutants configuration; see "Test quality" in docs/TESTING.md.

# The whole test suite runs in about a second; a mutant that makes the lexer
# or parser loop forever is caught by this timeout, so keep it short.
minimum_test_timeout = 5.0

# prost's output; xtask's tests check it matches the generator.
exclude_globs = ["crates/onnx-proto/src/generated.rs"]

exclude_re = [
    # Binary entry points: an exit code isn't visible to cargo test, so their
    # logic lives in functions that are tested.
    "replace main -> ExitCode with",
    "delete match arm .* in main",
    # The HTTP download needs the network; it was checked by hand against PyPI
    # and Hugging Face.
    "replace download -> Result<Vec<u8>, ureq::Error>",
    # Download, then call code that is tested; each fetch was checked by hand.
    "replace (onnx_tests|imagenet_v2|fetch) -> Result<\\(\\), FetchError> with Ok\\(\\(\\)\\)",
    # OR of bit fields that cannot overlap (sign and magnitude, implicit bit and
    # mantissa, exponent and mantissa), where XOR gives the same result.
    "replace \\| with \\^ in (FloatFormat::(encode|decode_magnitude|pack)|decompose)",
    # Writes generated.rs; what it writes is checked by xtask's test.
    "replace run -> Result<\\(\\), ProtoError> with Ok\\(\\(\\)\\)",
    # The step's direction picks the clamp range; SliceStep rejects zero, so
    # `step >= 0` is the same test.
    "replace > with >= in slice_axis",
    # Comparisons at a point where both branches give the same value: Relu,
    # Selu and PRelu at zero, Clip at its bounds, and Keys' cubic kernel at
    # |x| = 2, where both of its pieces are zero.
    "replace < with <= in relu",
    "replace > with >= in selu",
    "replace < with <= in prelu",
    "replace [<>] with [<>]= in clip",
    "replace < with <= in cubic",
    # Moving the start of the tap range only adds taps outside the kernel's
    # support, whose weights are zero.
    "replace \\+ with [-*] in stretched",
    # Negating every float's ordinal keeps the distances between them, which
    # is all the comparison uses.
    "replace == with != in ordinal",
]
