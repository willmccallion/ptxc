# cargo-mutants configuration; see "Test quality" in docs/TESTING.md.

# The whole test suite runs in about a second; a mutant that makes the lexer
# or parser loop forever is caught by this timeout, so keep it short.
minimum_test_timeout = 5.0

# prost's output; xtask's tests check it matches the generator.
exclude_globs = ["crates/onnx-proto/src/generated.rs"]

exclude_re = [
    # Binary entry points: an exit code isn't visible to cargo test, so their
    # logic lives in functions that are tested.
    "replace main -> ExitCode with",
    "delete match arm .* in main",
    # The HTTP download needs the network; the fetch was checked by hand
    # against PyPI.
    "replace download -> Result<Vec<u8>, ureq::Error>",
    # Downloads, then calls code that is tested; the fetch was checked by hand.
    "replace onnx_tests -> Result<\\(\\), FetchError> with Ok\\(\\(\\)\\)",
    # OR of bit fields that cannot overlap (sign and magnitude, implicit bit and
    # mantissa, exponent and mantissa), where XOR gives the same result.
    "replace \\| with \\^ in (FloatFormat::(encode|decode_magnitude|pack)|decompose)",
    # Writes generated.rs; what it writes is checked by xtask's test.
    "replace run -> Result<\\(\\), ProtoError> with Ok\\(\\(\\)\\)",
]
